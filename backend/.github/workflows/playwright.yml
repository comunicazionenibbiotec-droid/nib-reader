name: ZenPSA Playwright QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install test dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx playwright install --with-deps chromium
      - name: Run desktop and smartphone regression tests
        env:
          ZENPSA_USE_LOCAL_SERVER: '1'
          ZENPSA_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e -- --project=desktop-chrome --project=mobile-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenpsa-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
