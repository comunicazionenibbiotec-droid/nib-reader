name: ZenPSA Playwright
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Detector V2 and Reader V1 tests
        env:
          ZENPSA_USE_LOCAL_SERVER: '1'
          ZENPSA_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e -- --project=desktop-chrome --project=mobile-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
